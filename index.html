<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undangan Pernikahan - Budi & Shinta</title>

    <!-- External Dependencies -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Cormorant+Garamond:wght@300;400;600&family=Montserrat:wght@300;400;600&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <!--
      Catatan: AOS (animate-on-scroll) sengaja dilepas dari halaman cover ini,
      karena animasinya sekarang datang dari video intro itu sendiri + transisi
      manual di bawah. Kalau dipakai bareng AOS, teksnya bisa nongol duluan
      sebelum videonya selesai.
    -->
    <style>
        /* ============================================================
           COVER STAGE — video intro -> fade ke background gambar
           ============================================================ */
        .cover-stage {
            position: relative;
            min-height: 100vh;
            min-height: 100svh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #1a1410;
            /* warna gelap sementara sebelum video/gambar tampil */
        }

        /* Layer 1: video intro */
        .cover-video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            transition: opacity 1s ease;
        }

        /* Layer 2: background gambar, disembunyikan dulu, muncul setelah video selesai */
        .cover-bg-image {
            position: absolute;
            inset: 0;
            z-index: 0;
            background-image: url('assets/images/cover-bg.jpg');
            /* GANTI dengan gambar background kamu */
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 1.4s ease;
        }

        /* Layer 3: overlay gelap tipis biar teks putih kebaca di atas gambar */
        .cover-overlay {
            position: absolute;
            inset: 0;
            z-index: 2;
            background: linear-gradient(180deg, rgba(0, 0, 0, .2) 0%, rgba(0, 0, 0, .55) 100%);
            opacity: 0;
            transition: opacity 1.4s ease;
        }

        /* Layer 4: konten (nama, tamu, countdown, tombol) */
        .cover-content {
            position: relative;
            z-index: 3;
            opacity: 0;
            transform: translateY(24px);
            transition: opacity 1s ease .2s, transform 1s ease .2s;
            pointer-events: none;
        }

        /* Petunjuk "ketuk utk lanjut", jaga-jaga kalau autoplay video gagal */
        .tap-hint {
            position: absolute;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 4;
            color: #fff;
            font-family: 'Cormorant Garamond', serif;
            font-size: .85rem;
            letter-spacing: 1px;
            opacity: 0;
            animation: fadeHint 1s ease 2.2s forwards;
        }

        @keyframes fadeHint {
            to {
                opacity: .85;
            }
        }

        /* Saat video sudah selesai/dilewati: tampilkan background + konten, sembunyikan video */
        .cover-stage.video-ended .cover-video {
            opacity: 0;
            pointer-events: none;
        }

        .cover-stage.video-ended .cover-bg-image,
        .cover-stage.video-ended .cover-overlay {
            opacity: 1;
        }

        .cover-stage.video-ended .cover-content {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .cover-stage.video-ended .tap-hint {
            display: none;
        }

        /* Mini countdown di halaman cover */
        .mini-countdown {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 20px 0 24px;
        }

        .mc-box {
            background: rgba(255, 255, 255, .88);
            border-radius: 14px;
            padding: 10px 14px;
            min-width: 58px;
            text-align: center;
            backdrop-filter: blur(3px);
        }

        .mc-box span {
            display: block;
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            font-size: 1.4rem;
            color: #5a4a3a;
        }

        .mc-box small {
            font-family: 'Cormorant Garamond', serif;
            font-size: .62rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #8b7355;
        }

        #timer p {
            color: #fff;
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
        }

        @media (prefers-reduced-motion: reduce) {

            .cover-video,
            .cover-bg-image,
            .cover-overlay,
            .cover-content {
                transition: none !important;
            }
        }
    </style>
</head>

<body>
    <!-- Cover / Hero Section -->
    <section class="cover-stage" id="coverStage">

        <!-- Video intro: animasinya sudah ada di dalam video ini sendiri -->
        <video id="introVideo" class="cover-video" autoplay muted playsinline webkit-playsinline
            poster="assets/images/cover-bg.jpg" preload="auto">
            <source src="assets/video/opening.mp4" type="video/mp4">
            <!-- GANTI path di atas dengan file video kamu -->
        </video>

        <!-- Background gambar (tampil setelah video selesai) -->
        <div class="cover-bg-image"></div>
        <div class="cover-overlay"></div>

        <p class="tap-hint">Ketuk layar untuk melanjutkan</p>

        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-md-10 col-lg-8">
                    <div class="cover-content text-center" id="coverContent">

                        <h4 class="hero-subtitle mb-3">The Wedding of</h4>
                        <h3 class="bride-groom mb-2">Budi & Shinta</h3>

                        <!-- Mini Countdown -->
                        <div id="timer">
                            <div class="mini-countdown">
                                <div class="mc-box">
                                    <span id="days">00</span>
                                    <small>Hari</small>
                                </div>
                                <div class="mc-box">
                                    <span id="hours">00</span>
                                    <small>Jam</small>
                                </div>
                                <div class="mc-box">
                                    <span id="minutes">00</span>
                                    <small>Menit</small>
                                </div>
                                <div class="mc-box">
                                    <span id="seconds">00</span>
                                    <small>Detik</small>
                                </div>
                            </div>
                        </div>

                        <!-- Guest Info -->
                        <div class="person-info">
                            <p class="greeting mb-2 text-white">Kepada Yth.</p>
                            <h5 class="guest-name mb-3 text-white">Al Madani 16</h5>
                            <p class="invitation-text px-3 px-md-5 text-white" style="font-size: 12px; font-weight: 600;">
                                Dengan penuh kebahagiaan, kami mengundang Anda untuk hadir dan memberikan doa restu
                                dalam pernikahan kami
                            </p>
                        </div>

                        <!-- Open Invitation Button -->
                        <a href="#" class="btn btn-instagram btn-lg mt-4" onclick="openInvitation()">
                            <i class="bi bi-envelope-heart"></i> Buka Undangan
                        </a>

                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Scripts -->
    <script>
        function openInvitation() {
            window.location.href = "isi.html";
        }

        // ---------------- Video intro -> reveal background + konten ----------------
        (function () {
            var stage = document.getElementById('coverStage');
            var video = document.getElementById('introVideo');
            var revealed = false;

            function reveal() {
                if (revealed) return;
                revealed = true;
                stage.classList.add('video-ended');
            }

            video.addEventListener('ended', reveal);
            video.addEventListener('error', reveal); // kalau video gagal dimuat, langsung tampilkan konten
            video.addEventListener('click', reveal);  // ketuk video = lewati intro
            stage.addEventListener('click', function (e) {
                if (!stage.classList.contains('video-ended')) reveal();
            });

            // jaring pengaman: kalau event "ended" tidak pernah terpicu (mis. autoplay diblokir browser),
            // tetap tampilkan konten setelah beberapa detik supaya tamu tidak nyangkut di layar video.
            setTimeout(reveal, 15000);
        })();

        // ---------------- Countdown ----------------
        // Ubah tanggal target sesuai tanggal & jam acara kamu
        const targetDate = new Date("Feb 1, 2026 08:00:00").getTime();

        const daysEl = document.getElementById("days");
        const hoursEl = document.getElementById("hours");
        const minutesEl = document.getElementById("minutes");
        const secondsEl = document.getElementById("seconds");

        function countdown() {
            const now = new Date().getTime();
            const distance = targetDate - now;

            if (distance < 0) {
                document.getElementById("timer").innerHTML = "<p>Sudah Hari H</p>";
                clearInterval(interval);
                return;
            }

            daysEl.innerText = Math.floor(distance / (1000 * 60 * 60 * 24));
            hoursEl.innerText = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            minutesEl.innerText = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            secondsEl.innerText = Math.floor((distance % (1000 * 60)) / 1000);
        }

        const interval = setInterval(countdown, 1000);
        countdown();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
